name: CI

# 后端有 200 多个测试，但在这之前没有任何东西在推代码时跑它们：
# 测试挂了照样能部署到 Railway。这个流程就是那道闸。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend — tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: backend
      - name: Tests
        run: npx jest --ci --silent
        working-directory: backend

  frontend:
    name: web admin — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # build 本身就跑 tsc，但单独跑一次能让类型错误和打包错误分得开
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  driver-app:
    name: driver app — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: driver-app/package-lock.json
      - run: npm ci
        working-directory: driver-app
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: driver-app

  docker:
    name: production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Railway 用仓库根目录的 Dockerfile 构建后端。这里先验一遍，
      # 免得构建失败只能在部署日志里才发现。
      - name: Build the image Railway deploys
        run: docker build -t ect-erp-backend:ci .

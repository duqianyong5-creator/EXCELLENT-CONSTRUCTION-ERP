name: macOS installer

# A .dmg can only be made on a Mac (electron-builder needs hdiutil), so the macOS build of the desktop
# console runs on a GitHub macOS runner. Unsigned: no Apple certificate, so on first launch the user
# right-clicks the app → Open (or allows it under System Settings → Privacy & Security).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    name: build unsigned dmg (Apple silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # hdiutil detach fails now and then with "resource busy" when Spotlight indexes the freshly mounted
      # image (seen on the 5 Nov run); stop indexing, and give the build one more try if it still trips
      - name: Stop Spotlight indexing
        run: sudo mdutil -a -i off || true
      - name: Build dmg
        run: npm run dist:mac || (sleep 20 && npm run dist:mac)
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ECT-ERP-macOS
          path: frontend/release/*.dmg
          if-no-files-found: error
